name: VPN Gate Node Check

on:
  # Avoid busy hour boundaries; GitHub may delay scheduled runs.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regression tests
        run: |
          python -m unittest discover -s tests -v
          node --check cloudflare/worker.mjs
          node --check cloudflare/checker.mjs
          node cloudflare/tests/dns.cjs cloudflare/worker.mjs
          node cloudflare/tests/run.mjs
          node cloudflare/tests/subscription.cjs
          node --test cloudflare/tests/checker.cjs

      - name: Download pinned official Mihomo for real HTTPS verification
        run: python download_mihomo.py --output "${RUNNER_TEMP}/mihomo"

      - name: Merge VPN Gate candidates + verify exit and actual HTTPS chain + build page
        run: python vpngate.py
        env:
          CHECK_WORKER: "https://ch.opopoiovcc.kdns.fr/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "8"
          CHECK_TIMEOUT: "45"
          CHECK_STAGE_BUDGET_SECONDS: "900"
          VERIFY_PASSES: "2"
          HTTPS_CHECK_CONCURRENCY: "8"
          HTTPS_STAGE_BUDGET_SECONDS: "900"
          SITE_URL: "https://mmaniu353-lab.github.io/hjhhh"
          MIHOMO_BINARY: "${{ runner.temp }}/mihomo"
          EDT_ENTRY_IPS: "172.64.155.1,172.64.144.1"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: ${{ steps.deployment.outputs.page_url }} (deploy outcome: ${{ steps.deployment.outcome }})"'
